name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: sarytest
          POSTGRES_DB: sary_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: API tests (incl. shared outings against Postgres)
        run: npm test -w @farq/map-api
        env:
          SARY_TEST_DATABASE_URL: postgres://postgres:sarytest@localhost:5432/sary_test
      - name: Web tests
        run: npm test -w @farq/map-web
      - name: Web build (type-check + bundle)
        run: npm run build
        env:
          # Build-time only; the bundle reads the real token from the Vercel project.
          VITE_MAPBOX_ACCESS_TOKEN: ci-placeholder
      - name: Bundle budget (gzip)
        run: npm run budget
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Map tiles tests (apps/tiles)
        working-directory: apps/tiles
        run: |
          pip install -r requirements-test.txt
          python3 -m unittest test_build_tiles

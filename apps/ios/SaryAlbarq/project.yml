# Sary Albarq (سَرى البارق) — native iOS client for shared outings.
# Generate the Xcode project with `xcodegen generate` (the generated
# SaryAlbarq.xcodeproj is committed too, so Xcode alone is enough).
name: SaryAlbarq
options:
  bundleIdPrefix: sa.sary
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
# Mapbox Maps SDK v11 (same renderer family as the web's Mapbox GL v3), pinned exactly.
# It is pinned to the exact version the Navigation SDK below requires (Navigation
# 3.27.3 pins Maps 11.27.3 exactly in its Package.swift); move both together.
packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    exactVersion: 11.27.3
  # Mapbox Navigation SDK v3 (turn-by-turn). Only the Core product is used (no
  # NavigationViewController / CarPlayManager): our own UI over our own map.
  MapboxNavigation:
    url: https://github.com/mapbox/mapbox-navigation-ios.git
    exactVersion: 3.27.3
# Explicit base settings: these are what XcodeGen's presets would add, spelled
# out so the project generates the same with any XcodeGen install.
settings:
  base:
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    PRODUCT_NAME: $(TARGET_NAME)
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "48.2"
    # Apple Team ID (same account as FarqNavigate).
    DEVELOPMENT_TEAM: MH7J92HV9N
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      VALIDATE_PRODUCT: YES
targets:
  SaryAlbarq:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes:
          - "SaryVoice/**"
      # «صوت سرى»: the owner's recorded guidance clips + manifest.json, kept as a folder in the bundle.
      - path: Resources/SaryVoice
        type: folder
        buildPhase: resources
      - Shared
    dependencies:
      - package: MapboxMaps
        product: MapboxMaps
      - package: MapboxNavigation
        product: MapboxNavigationCore
      - package: MapboxNavigation
        product: MapboxDirections
      # The outing's Live Activity (Lock Screen + Dynamic Island).
      - target: SaryAlbarqWidgets
      # «شارك إلى سَرى البارق» for YouTube links (Sources/Media).
      - target: SaryShare
    # Config/Base.xcconfig optionally includes the gitignored Config/Secrets.xcconfig
    # (MAPBOX_ACCESS_TOKEN), which Info.plist hands to Mapbox as MBXAccessToken.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        # OWNER: change if you register a different App ID.
        PRODUCT_BUNDLE_IDENTIFIER: sa.sary.albarq
        PRODUCT_NAME: SaryAlbarq
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # CarPlay entitlement only when CARPLAY_ENABLED=YES (Config/Base.xcconfig).
        CODE_SIGN_ENTITLEMENTS: $(SARY_ENTITLEMENTS_$(CARPLAY_ENABLED))
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
  # Widget extension: the outing's Live Activity. Shares only Shared/ with the app
  # (ActivityAttributes + the pure display rules); no App Group needed.
  SaryAlbarqWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - path: Resources/Fonts
        buildPhase: resources
    settings:
      base:
        # OWNER: register this App ID (no extra capabilities needed).
        PRODUCT_BUNDLE_IDENTIFIER: sa.sary.albarq.widgets
        PRODUCT_NAME: SaryAlbarqWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
  # Share extension: a shared YouTube link → its video id → the app's «يوتيوب ← قناتي».
  # OWNER: register sa.sary.albarq.share and the App Group group.sa.sary.albarq
  # (automatic signing does both). Without the group the link is still copied to the clipboard.
  SaryShare:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - ShareExtension
      - Sources/Media/YouTubeLink.swift
      - Sources/Media/MediaShareInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.sary.albarq.share
        PRODUCT_NAME: SaryShare
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # TEMPORARY (build 6): without the App Group on device/archive builds (Config/Base.xcconfig).
        CODE_SIGN_ENTITLEMENTS: $(SARY_SHARE_ENTITLEMENTS_PENDING_$(SARY_PORTAL_PENDING))
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
  SaryAlbarqTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [TestRoutes]
      # Shared drive scenarios (GPX + expected results), one folder in the test bundle.
      - path: Tests/TestRoutes
        type: folder
        buildPhase: resources
    dependencies:
      - target: SaryAlbarq
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: sa.sary.albarq.tests
        # Same minimum as the app (iOS 17.0, owner decision).
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SaryAlbarq.app/SaryAlbarq
        BUNDLE_LOADER: $(TEST_HOST)
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@loader_path/Frameworks"]
  SaryAlbarqUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SaryAlbarq
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: sa.sary.albarq.uitests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TEST_TARGET_NAME: SaryAlbarq
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@loader_path/Frameworks"]
schemes:
  SaryAlbarq:
    build:
      targets:
        SaryAlbarq: all
        SaryAlbarqTests: [test]
        SaryAlbarqUITests: [test]
    test:
      targets: [SaryAlbarqTests, SaryAlbarqUITests]
      gatherCoverageData: false
    run:
      config: Debug
